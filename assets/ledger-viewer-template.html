<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>懒人记账</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e6ebf1;
      --panel: #f7f9fb;
      --ink: #1b2740;
      --muted: #5d6b80;
      --line: #c5d0dc;
      --expense: #b4453a;
      --income: #1e7a62;
      --refund: #2c6bb0;
      --transfer: #675889;
      --heat: #1b2740;
      --chip: #dfe6ee;
      --focus: #2c6bb0;
      --shadow: 0 10px 30px rgba(27, 39, 64, 0.06);
      --mono: ui-monospace, "SF Mono", "Menlo", "PingFang SC", monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --paper: #121820;
        --panel: #1b232e;
        --ink: #e7edf4;
        --muted: #9aa7b8;
        --line: #324155;
        --expense: #e07a70;
        --income: #4db69a;
        --refund: #7aa7e0;
        --transfer: #b3a3d6;
        --heat: #8fb4e8;
        --chip: #243040;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      }
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      background:
        linear-gradient(180deg, rgba(27, 39, 64, 0.03), transparent 180px),
        var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
    }

    button, select, input { font: inherit; color: inherit; }

    button, a, select, input { touch-action: manipulation; }

    :focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 28px clamp(16px, 4vw, 36px) 64px;
    }

    header.hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      margin-bottom: 22px;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 6px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: -0.03em;
      font-weight: 650;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .hero-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      cursor: pointer;
      min-width: 44px;
    }

    .btn:hover { border-color: var(--ink); }

    .period-row, .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }

    .chip {
      height: 40px;
      padding: 0 12px;
      border: 1px solid transparent;
      background: var(--chip);
      border-radius: 999px;
      cursor: pointer;
    }

    .chip[aria-pressed="true"] {
      background: var(--ink);
      color: var(--panel);
    }

    .field {
      display: grid;
      gap: 4px;
      min-width: min(100%, 160px);
      flex: 1;
    }

    .field span {
      font-size: 12px;
      color: var(--muted);
    }

    input, select {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      padding: 0 12px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin: 16px 0;
    }

    .metric, .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .metric { padding: 16px; min-height: 108px; }

    .metric-label, .panel-kicker {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-value {
      margin-top: 8px;
      font-family: var(--mono);
      font-size: clamp(22px, 3vw, 32px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.04em;
    }

    .delta {
      margin-top: 8px;
      font-size: 13px;
      color: var(--muted);
    }

    .delta.up { color: var(--expense); }
    .delta.down { color: var(--income); }

    .expense { color: var(--expense); }
    .income { color: var(--income); }
    .refund { color: var(--refund); }
    .transfer { color: var(--transfer); }

    .grid-2 {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
    }

    .panel { overflow: hidden; }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2 {
      margin: 0;
      font-size: 16px;
    }

    .calendar, .bars, .ranks, .review, .daily {
      padding: 14px 16px 16px;
    }

    .weekdays, .days {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .weekdays span, .day {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
    }

    .day {
      min-height: 44px;
      border-radius: 10px;
      display: grid;
      place-content: center;
      border: 1px solid transparent;
      font-variant-numeric: tabular-nums;
    }

    .day.has {
      color: var(--ink);
      border-color: color-mix(in srgb, var(--heat) 18%, var(--line));
    }

    .day.today { box-shadow: inset 0 0 0 2px var(--ink); }

    .legend {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 12px;
      margin-top: 10px;
    }

    .swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: var(--heat);
    }

    .bar-row, .rank-row {
      display: grid;
      grid-template-columns: 84px 1fr auto;
      gap: 10px;
      align-items: center;
      font-size: 14px;
      margin: 0 0 10px;
    }

    .bar-track {
      height: 10px;
      background: var(--chip);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill.over { background: var(--expense); }
    .bar-fill.ok { background: var(--income); }

    .amount {
      font-family: var(--mono);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      white-space: nowrap;
    }

    .daily-row {
      display: grid;
      grid-template-columns: 64px 1fr 88px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border-radius: 999px;
      background: var(--chip);
      font-size: 12px;
    }

    .badge.expense { color: var(--expense); }
    .badge.income { color: var(--income); }
    .badge.refund { color: var(--refund); }
    .badge.transfer { color: var(--transfer); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: color-mix(in srgb, var(--panel) 86%, var(--chip));
    }

    td.amount { text-align: right; }

    .empty {
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
    }

    .cards { display: none; }

    .tx-card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .tx-meta { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @media (max-width: 980px) {
      header.hero, .metrics, .grid-2 { grid-template-columns: 1fr; }
    }

    @media (max-width: 720px) {
      .table-wrap { display: none; }
      .cards { display: block; }
      .bar-row, .rank-row, .daily-row { grid-template-columns: 72px 1fr; }
      .bar-row .amount, .rank-row .amount, .daily-row .amount { grid-column: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }

    @media print {
      body { background: white; }
      .hero-actions, .filters, .period-row { display: none; }
      .metric, .panel { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div>
        <div class="eyebrow">Local ledger</div>
        <h1>懒人记账</h1>
        <div class="sub" id="ledgerMeta">本地账本</div>
      </div>
      <div class="hero-actions">
        <button class="btn" id="exportBtn" type="button">导出 CSV</button>
      </div>
    </header>

    <div class="period-row" role="group" aria-label="时间范围">
      <button class="chip" type="button" data-range="this-month">本月</button>
      <button class="chip" type="button" data-range="last-month">上月</button>
      <button class="chip" type="button" data-range="last7">近7天</button>
      <button class="chip" type="button" data-range="last30">近30天</button>
      <button class="chip" type="button" data-range="all">全部</button>
    </div>

    <div class="filters">
      <label class="field">
        <span>月份</span>
        <select id="monthFilter"></select>
      </label>
      <label class="field">
        <span>类型</span>
        <select id="typeFilter">
          <option value="">全部类型</option>
          <option value="expense">支出</option>
          <option value="income">收入</option>
          <option value="refund">退款</option>
          <option value="transfer">转账</option>
        </select>
      </label>
      <label class="field">
        <span>分类</span>
        <select id="categoryFilter"></select>
      </label>
      <label class="field">
        <span>渠道</span>
        <select id="methodFilter">
          <option value="">全部渠道</option>
          <option value="wechat">微信</option>
          <option value="alipay">支付宝</option>
          <option value="cash">现金</option>
          <option value="card">信用卡</option>
          <option value="bank">银行卡</option>
          <option value="other">其他</option>
        </select>
      </label>
      <label class="field">
        <span>账户</span>
        <select id="accountFilter">
          <option value="">全部账户</option>
        </select>
      </label>
      <label class="field">
        <span>搜索</span>
        <input id="searchInput" type="search" placeholder="商户、备注、金额">
      </label>
    </div>

    <section class="metrics" aria-label="汇总">
      <div class="metric">
        <div class="metric-label">支出</div>
        <div class="metric-value expense" id="expenseTotal">¥0.00</div>
        <div class="delta" id="expenseDelta">较上期 —</div>
      </div>
      <div class="metric">
        <div class="metric-label">收入</div>
        <div class="metric-value income" id="incomeTotal">¥0.00</div>
        <div class="delta" id="countLabel">0 笔</div>
      </div>
      <div class="metric">
        <div class="metric-label">净额</div>
        <div class="metric-value" id="netTotal">¥0.00</div>
        <div class="delta" id="avgLabel">日均 ¥0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">待复核</div>
        <div class="metric-value" id="reviewTotal">0</div>
        <div class="delta">低置信或未分类</div>
      </div>
    </section>

    <div class="grid-2">
      <section class="panel">
        <div class="panel-head">
          <h2>账户余额</h2>
          <span class="panel-kicker">含期初</span>
        </div>
        <div class="ranks" id="accountBalances"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>预算</h2>
          <span class="panel-kicker" id="budgetLabel">本月</span>
        </div>
        <div class="bars" id="budgetBars"></div>
      </section>
    </div>

    <div class="grid-2" style="margin-top:12px">
      <section class="panel">
        <div class="panel-head">
          <h2>支出月历</h2>
          <span class="panel-kicker" id="calendarLabel">按日深浅</span>
        </div>
        <div class="calendar">
          <div class="weekdays" aria-hidden="true">
            <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
          </div>
          <div class="days" id="calendarDays"></div>
          <div class="legend"><span class="swatch" style="opacity:.15"></span>少<span class="swatch"></span>多</div>
          <p class="sr-only" id="calendarSummary"></p>
        </div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>分类支出</h2>
          <span class="panel-kicker" id="categoryCount">0 类</span>
        </div>
        <div class="bars" id="categoryBars"></div>
      </section>
    </div>

    <div class="grid-2" style="margin-top:12px">
      <section class="panel">
        <div class="panel-head">
          <h2>商户排行</h2>
          <span class="panel-kicker">支出最多</span>
        </div>
        <div class="ranks" id="merchantRanks"></div>
      </section>
      <section class="panel">
        <div class="panel-head">
          <h2>每日支出</h2>
          <span class="panel-kicker" id="dailyCount">0 天</span>
        </div>
        <div class="daily" id="dailyBars"></div>
      </section>
    </div>

    <section class="panel" style="margin-top:12px" id="reviewPanel">
      <div class="panel-head">
        <h2>待复核</h2>
        <span class="panel-kicker">截图导入或分类为「其他」</span>
      </div>
      <div class="review" id="reviewList"></div>
    </section>

    <section class="panel" style="margin-top:12px">
      <div class="panel-head">
        <h2>流水明细</h2>
        <span class="panel-kicker" id="rowCount">0 笔</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>分类</th>
              <th>商户</th>
              <th>账户</th>
              <th>渠道</th>
              <th>备注</th>
              <th style="text-align:right">金额</th>
            </tr>
          </thead>
          <tbody id="transactionRows"></tbody>
        </table>
      </div>
      <div class="cards" id="transactionCards"></div>
    </section>
  </div>

  <script>
    const LEDGER_DATA = __LEDGER_DATA__;
    const txs = Array.isArray(LEDGER_DATA.transactions) ? LEDGER_DATA.transactions : [];
    const typeLabel = { expense: "支出", income: "收入", refund: "退款", transfer: "转账" };
    const methodLabel = { wechat: "微信", alipay: "支付宝", cash: "现金", card: "信用卡", bank: "银行卡", other: "其他" };

    const monthFilter = document.getElementById("monthFilter");
    const typeFilter = document.getElementById("typeFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const methodFilter = document.getElementById("methodFilter");
    const accountFilter = document.getElementById("accountFilter");
    const searchInput = document.getElementById("searchInput");
    const chips = [...document.querySelectorAll(".chip[data-range]")];
    let rangeMode = "this-month";

    const formatMoney = (value) => new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: LEDGER_DATA.currency || "CNY"
    }).format(Number(value || 0));
    const formatDate = (value) => (value || "").slice(0, 10);
    const monthOf = (tx) => (tx.occurred_at || "").slice(0, 7);
    const toDate = (value) => {
      const stamp = formatDate(value);
      return stamp ? new Date(`${stamp}T12:00:00`) : null;
    };
    const iso = (date) => {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    };
    const today = new Date();

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function unique(values) {
      return [...new Set(values.filter(Boolean))];
    }

    function periodBounds() {
      const firstOfMonth = (date) => new Date(date.getFullYear(), date.getMonth(), 1);
      const lastOfMonth = (date) => new Date(date.getFullYear(), date.getMonth() + 1, 0);
      if (rangeMode === "this-month") {
        return { start: iso(firstOfMonth(today)), end: iso(today), month: iso(today).slice(0, 7) };
      }
      if (rangeMode === "last-month") {
        const pivot = new Date(today.getFullYear(), today.getMonth() - 1, 1);
        return { start: iso(firstOfMonth(pivot)), end: iso(lastOfMonth(pivot)), month: iso(pivot).slice(0, 7) };
      }
      if (rangeMode === "last7") {
        const start = new Date(today);
        start.setDate(today.getDate() - 6);
        return { start: iso(start), end: iso(today) };
      }
      if (rangeMode === "last30") {
        const start = new Date(today);
        start.setDate(today.getDate() - 29);
        return { start: iso(start), end: iso(today) };
      }
      if (rangeMode.startsWith("month:")) {
        const month = rangeMode.slice(6);
        const [year, mon] = month.split("-").map(Number);
        const start = new Date(year, mon - 1, 1);
        return { start: iso(start), end: iso(lastOfMonth(start)), month };
      }
      return { start: "", end: "" };
    }

    function previousBounds(bounds) {
      if (!bounds.start || !bounds.end) return null;
      const start = new Date(`${bounds.start}T12:00:00`);
      const end = new Date(`${bounds.end}T12:00:00`);
      if (bounds.month) {
        const pivot = new Date(start.getFullYear(), start.getMonth() - 1, 1);
        const last = new Date(pivot.getFullYear(), pivot.getMonth() + 1, 0);
        return { start: iso(pivot), end: iso(last) };
      }
      const days = Math.round((end - start) / 86400000) + 1;
      const prevEnd = new Date(start);
      prevEnd.setDate(start.getDate() - 1);
      const prevStart = new Date(prevEnd);
      prevStart.setDate(prevEnd.getDate() - (days - 1));
      return { start: iso(prevStart), end: iso(prevEnd) };
    }

    function inBounds(tx, bounds) {
      const day = formatDate(tx.occurred_at);
      if (bounds.start && day < bounds.start) return false;
      if (bounds.end && day > bounds.end) return false;
      return true;
    }

    function applyFilters(source, bounds) {
      const type = typeFilter.value;
      const category = categoryFilter.value;
      const method = methodFilter.value;
      const account = accountFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      return source.filter((tx) => {
        if (bounds && !inBounds(tx, bounds)) return false;
        if (type && tx.type !== type) return false;
        if (category && (tx.category || "其他") !== category) return false;
        if (method && (tx.method || "") !== method) return false;
        if (account && ![tx.account_id, tx.account, tx.to_account_id, tx.to_account].includes(account)) return false;
        if (query) {
          const haystack = [tx.amount, tx.category, tx.merchant, tx.note, tx.type, tx.method, tx.account, tx.to_account].join(" ").toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      }).sort((a, b) => String(b.occurred_at || "").localeCompare(String(a.occurred_at || "")));
    }

    function fillFilters() {
      const months = unique(txs.map(monthOf)).sort().reverse();
      monthFilter.innerHTML = `<option value="">按范围</option>` + months.map((month) => `<option value="${escapeHtml(month)}">${escapeHtml(month)}</option>`).join("");
      const categories = unique(txs.map((tx) => tx.category || "其他")).sort();
      categoryFilter.innerHTML = `<option value="">全部分类</option>` + categories.map((item) => `<option value="${escapeHtml(item)}">${escapeHtml(item)}</option>`).join("");
      const accounts = (Array.isArray(LEDGER_DATA.accounts) ? LEDGER_DATA.accounts : []).filter((item) => item && !item.archived);
      const named = unique(txs.flatMap((tx) => [tx.account, tx.to_account]));
      const options = accounts.length ? accounts.map((item) => [item.id, item.name]) : named.map((name) => [name, name]);
      accountFilter.innerHTML = `<option value="">全部账户</option>` + options.map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`).join("");
    }

    function pct(newValue, oldValue) {
      if (!oldValue) return newValue ? 100 : null;
      return ((newValue - oldValue) / oldValue) * 100;
    }

    function deltaText(value) {
      if (value === null || Number.isNaN(value)) return "较上期 —";
      const sign = value > 0 ? "+" : "";
      return `较上期 ${sign}${value.toFixed(1)}%`;
    }

    function dayCount(bounds, rows) {
      if (bounds.start && bounds.end) {
        const start = new Date(`${bounds.start}T12:00:00`);
        const end = new Date(`${bounds.end}T12:00:00`);
        return Math.max(1, Math.round((end - start) / 86400000) + 1);
      }
      const days = unique(rows.map((tx) => formatDate(tx.occurred_at))).sort();
      if (days.length < 2) return 1;
      return Math.max(1, Math.round((new Date(`${days.at(-1)}T12:00:00`) - new Date(`${days[0]}T12:00:00`)) / 86400000) + 1);
    }

    function renderCalendar(rows, bounds) {
      const monthStamp = bounds.month || (rows[0] ? monthOf(rows[0]) : iso(today).slice(0, 7));
      const [year, month] = monthStamp.split("-").map(Number);
      const first = new Date(year, month - 1, 1);
      const last = new Date(year, month, 0);
      const pad = (first.getDay() + 6) % 7;
      const byDay = {};
      for (const tx of rows) {
        if ((tx.type || "expense") !== "expense") continue;
        if (monthOf(tx) !== monthStamp) continue;
        const day = formatDate(tx.occurred_at);
        byDay[day] = (byDay[day] || 0) + Number(tx.amount || 0);
      }
      const max = Math.max(...Object.values(byDay), 1);
      const cells = [];
      for (let i = 0; i < pad; i += 1) cells.push(`<div></div>`);
      for (let day = 1; day <= last.getDate(); day += 1) {
        const stamp = `${monthStamp}-${String(day).padStart(2, "0")}`;
        const amount = byDay[stamp] || 0;
        const intensity = amount ? Math.max(0.12, amount / max) : 0;
        const isToday = stamp === iso(today);
        cells.push(`<div class="day${amount ? " has" : ""}${isToday ? " today" : ""}" title="${stamp} ${formatMoney(amount)}" style="${amount ? `background: color-mix(in srgb, var(--heat) ${Math.round(intensity * 100)}%, transparent)` : ""}">${day}</div>`);
      }
      document.getElementById("calendarDays").innerHTML = cells.join("");
      document.getElementById("calendarLabel").textContent = monthStamp;
      document.getElementById("calendarSummary").textContent = `${monthStamp} 共 ${Object.keys(byDay).length} 天有支出，最高单日 ${formatMoney(max)}`;
    }

    function barList(entries, emptyText) {
      if (!entries.length) return `<div class="empty">${emptyText}</div>`;
      const max = Math.max(...entries.map((item) => item[1]), 1);
      return entries.map(([label, amount]) => {
        const width = Math.max(4, (amount / max) * 100);
        return `<div class="bar-row">
          <span>${escapeHtml(label)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <span class="amount">${formatMoney(amount)}</span>
        </div>`;
      }).join("");
    }

    function accountBalances() {
      const accounts = (Array.isArray(LEDGER_DATA.accounts) ? LEDGER_DATA.accounts : []).filter((item) => item && !item.archived);
      const state = {};
      for (const account of accounts) {
        state[account.id] = { name: account.name, balance: Number(account.opening_balance || 0) };
      }
      const nameToId = Object.fromEntries(accounts.map((item) => [item.name, item.id]));
      const resolve = (id, name) => (id && state[id] ? id : nameToId[name]);
      for (const tx of txs) {
        const amount = Number(tx.amount || 0);
        const source = resolve(tx.account_id, tx.account);
        const dest = resolve(tx.to_account_id, tx.to_account);
        if (tx.type === "expense" && source) state[source].balance -= amount;
        if ((tx.type === "income" || tx.type === "refund") && source) state[source].balance += amount;
        if (tx.type === "transfer") {
          if (source) state[source].balance -= amount;
          if (dest) state[dest].balance += amount;
        }
      }
      return accounts.map((account) => [account.name, state[account.id].balance]);
    }

    function budgetRows(rows, bounds) {
      const month = bounds.month;
      if (!month) return [];
      const budgets = (Array.isArray(LEDGER_DATA.budgets) ? LEDGER_DATA.budgets : []).filter(Boolean);
      const specific = budgets.filter((item) => item.month === month);
      const templates = budgets.filter((item) => !item.month);
      const used = new Set(specific.map((item) => item.category || ""));
      const active = specific.concat(templates.filter((item) => !used.has(item.category || "")));
      let expenseTotal = 0;
      const byCategory = {};
      for (const tx of rows) {
        if ((tx.type || "expense") !== "expense") continue;
        const amount = Number(tx.amount || 0);
        expenseTotal += amount;
        const category = tx.category || "其他";
        byCategory[category] = (byCategory[category] || 0) + amount;
      }
      return active.map((item) => {
        const limit = Number(item.amount || 0);
        const spent = item.category ? (byCategory[item.category] || 0) : expenseTotal;
        return {
          label: item.category || "本月总额",
          limit,
          spent,
          remaining: limit - spent,
          over: spent > limit
        };
      });
    }

    function render() {
      chips.forEach((chip) => chip.setAttribute("aria-pressed", chip.dataset.range === rangeMode ? "true" : "false"));
      const bounds = periodBounds();
      const rows = applyFilters(txs, bounds);
      const previous = previousBounds(bounds);
      const previousRows = previous ? applyFilters(txs, previous) : [];
      const totals = { expense: 0, income: 0, refund: 0, transfer: 0 };
      const prevTotals = { expense: 0, income: 0, refund: 0, transfer: 0 };
      const byCategory = {};
      const byMerchant = {};
      const byDay = {};
      const review = [];

      for (const tx of rows) {
        const type = tx.type || "expense";
        const amount = Number(tx.amount || 0);
        if (Object.prototype.hasOwnProperty.call(totals, type)) totals[type] += amount;
        if (type === "expense") {
          byCategory[tx.category || "其他"] = (byCategory[tx.category || "其他"] || 0) + amount;
          byMerchant[tx.merchant || "未填商户"] = (byMerchant[tx.merchant || "未填商户"] || 0) + amount;
          const day = formatDate(tx.occurred_at) || "未知";
          byDay[day] = (byDay[day] || 0) + amount;
        }
        const confidence = Number(tx.confidence);
        if ((Number.isFinite(confidence) && confidence < 0.85) || (tx.category || "其他") === "其他") {
          review.push(tx);
        }
      }
      for (const tx of previousRows) {
        const type = tx.type || "expense";
        const amount = Number(tx.amount || 0);
        if (Object.prototype.hasOwnProperty.call(prevTotals, type)) prevTotals[type] += amount;
      }

      const expenseChange = previous ? pct(totals.expense, prevTotals.expense) : null;
      document.getElementById("expenseTotal").textContent = formatMoney(totals.expense);
      document.getElementById("incomeTotal").textContent = formatMoney(totals.income);
      document.getElementById("netTotal").textContent = formatMoney(totals.income + totals.refund - totals.expense);
      document.getElementById("reviewTotal").textContent = String(review.length);
      document.getElementById("countLabel").textContent = `${rows.length} 笔`;
      document.getElementById("avgLabel").textContent = `日均 ${formatMoney(totals.expense / dayCount(bounds, rows))}`;
      const delta = document.getElementById("expenseDelta");
      delta.textContent = previous ? deltaText(expenseChange) : "选择有起止的范围后可对比";
      delta.className = `delta${expenseChange > 0 ? " up" : expenseChange < 0 ? " down" : ""}`;
      document.getElementById("rowCount").textContent = `${rows.length} 笔`;

      const categoryRows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
      document.getElementById("categoryCount").textContent = `${categoryRows.length} 类`;
      document.getElementById("categoryBars").innerHTML = barList(categoryRows, "暂无分类支出");

      const merchantRows = Object.entries(byMerchant).sort((a, b) => b[1] - a[1]).slice(0, 8);
      document.getElementById("merchantRanks").innerHTML = barList(merchantRows, "暂无商户统计");

      const dailyRows = Object.entries(byDay).sort((a, b) => b[0].localeCompare(a[0])).slice(0, 10);
      document.getElementById("dailyCount").textContent = `${Object.keys(byDay).length} 天`;
      document.getElementById("dailyBars").innerHTML = barList(dailyRows.map(([day, amount]) => [day.slice(5), amount]), "暂无每日支出");

      const balances = accountBalances();
      document.getElementById("accountBalances").innerHTML = balances.length ? balances.map(([name, amount]) => {
        return `<div class="rank-row"><span>${escapeHtml(name)}</span><span></span><span class="amount">${formatMoney(amount)}</span></div>`;
      }).join("") : `<div class="empty">还没有账户</div>`;
      const budgets = budgetRows(rows, bounds);
      document.getElementById("budgetLabel").textContent = bounds.month || "选择月份后显示";
      document.getElementById("budgetBars").innerHTML = budgets.length ? budgets.map((item) => {
        const width = item.limit ? Math.min(100, Math.max(4, (item.spent / item.limit) * 100)) : 0;
        return `<div class="bar-row">
          <span>${escapeHtml(item.label)}</span>
          <div class="bar-track"><div class="bar-fill ${item.over ? "over" : "ok"}" style="width:${width}%"></div></div>
          <span class="amount">${formatMoney(item.spent)} / ${formatMoney(item.limit)}</span>
        </div>`;
      }).join("") : `<div class="empty">还没有预算</div>`;

      renderCalendar(rows, bounds);

      document.getElementById("reviewList").innerHTML = review.length ? review.slice(0, 8).map((tx) => {
        return `<div class="rank-row">
          <span>${escapeHtml(formatDate(tx.occurred_at))}</span>
          <span>${escapeHtml(tx.merchant || tx.note || tx.id)}</span>
          <span class="amount">${formatMoney(tx.amount)}</span>
        </div>`;
      }).join("") : `<div class="empty">没有需要复核的记录</div>`;

      document.getElementById("transactionRows").innerHTML = rows.length ? rows.map((tx) => {
        const type = tx.type || "expense";
        return `<tr>
          <td>${escapeHtml(formatDate(tx.occurred_at))}</td>
          <td><span class="badge ${escapeHtml(type)}">${escapeHtml(typeLabel[type] || type)}</span></td>
          <td>${escapeHtml(tx.category || "其他")}</td>
          <td>${escapeHtml(tx.merchant || "")}</td>
          <td>${escapeHtml(tx.to_account ? `${tx.account || ""}→${tx.to_account}` : (tx.account || ""))}</td>
          <td>${escapeHtml(methodLabel[tx.method] || tx.method || "")}</td>
          <td>${escapeHtml(tx.note || "")}</td>
          <td class="amount ${escapeHtml(type)}">${formatMoney(tx.amount)}</td>
        </tr>`;
      }).join("") : `<tr><td colspan="8"><div class="empty">这段时间没有流水</div></td></tr>`;

      document.getElementById("transactionCards").innerHTML = rows.length ? rows.map((tx) => {
        const type = tx.type || "expense";
        return `<article class="tx-card">
          <div>
            <strong>${escapeHtml(tx.merchant || tx.category || "未命名")}</strong>
            <div class="tx-meta">${escapeHtml(formatDate(tx.occurred_at))} · ${escapeHtml(typeLabel[type] || type)} · ${escapeHtml(tx.category || "其他")}${tx.account ? " · " + escapeHtml(tx.to_account ? `${tx.account}→${tx.to_account}` : tx.account) : ""}</div>
          </div>
          <div class="amount ${escapeHtml(type)}">${formatMoney(tx.amount)}</div>
        </article>`;
      }).join("") : `<div class="empty">这段时间没有流水</div>`;
    }

    function exportCsv() {
      const rows = applyFilters(txs, periodBounds());
      const header = ["日期", "类型", "分类", "商户", "账户", "渠道", "备注", "金额"];
      const lines = [header.join(",")].concat(rows.map((tx) => [
        formatDate(tx.occurred_at),
        typeLabel[tx.type] || tx.type,
        tx.category || "",
        tx.merchant || "",
        tx.to_account ? `${tx.account || ""}→${tx.to_account}` : (tx.account || ""),
        methodLabel[tx.method] || tx.method || "",
        String(tx.note || "").replaceAll('"', '""'),
        tx.amount
      ].map((value) => `"${value}"`).join(",")));
      const blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "lazy-ledger.csv";
      link.click();
      URL.revokeObjectURL(url);
    }

    document.getElementById("ledgerMeta").textContent = `交易 ${txs.length} 笔 · 更新 ${formatDate(LEDGER_DATA.updated_at) || "未知"}`;
    fillFilters();
    const months = unique(txs.map(monthOf));
    const currentMonth = iso(today).slice(0, 7);
    rangeMode = months.includes(currentMonth) ? "this-month" : (months.length ? `month:${months.sort().reverse()[0]}` : "all");
    if (rangeMode.startsWith("month:")) monthFilter.value = rangeMode.slice(6);
    chips.forEach((chip) => chip.addEventListener("click", () => {
      rangeMode = chip.dataset.range;
      monthFilter.value = "";
      render();
    }));
    monthFilter.addEventListener("change", () => {
      rangeMode = monthFilter.value ? `month:${monthFilter.value}` : "all";
      render();
    });
    [typeFilter, categoryFilter, methodFilter, accountFilter, searchInput].forEach((el) => el.addEventListener("input", render));
    document.getElementById("exportBtn").addEventListener("click", exportCsv);
    render();
  </script>
</body>
</html>
