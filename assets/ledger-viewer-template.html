<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>懒人记账</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --line: #dde2ea;
      --text: #18202b;
      --muted: #687386;
      --expense: #d94b4b;
      --income: #198754;
      --refund: #2f6fed;
      --transfer: #7b61ff;
      --ink: #111827;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    header {
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      padding: 20px clamp(16px, 4vw, 40px);
    }

    h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.25;
    }

    .sub {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 20px clamp(12px, 3vw, 28px) 40px;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    input, select {
      width: 100%;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
      font: inherit;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }

    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      min-height: 86px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 8px;
    }

    .metric-value {
      font-size: 22px;
      font-weight: 700;
      white-space: nowrap;
    }

    .expense { color: var(--expense); }
    .income { color: var(--income); }
    .refund { color: var(--refund); }
    .transfer { color: var(--transfer); }

    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 16px;
      overflow: hidden;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding: 13px 14px;
      font-size: 16px;
      font-weight: 700;
    }

    .section-title span:last-child {
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
    }

    .bars {
      padding: 14px;
      display: grid;
      gap: 12px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 88px 1fr 88px;
      gap: 10px;
      align-items: center;
      font-size: 14px;
    }

    .bar-track {
      height: 10px;
      background: #edf0f4;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--ink);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 11px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: var(--muted);
      font-weight: 600;
      background: #fbfcfd;
    }

    td.amount {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .empty {
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 860px) {
      .filters, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .bar-row { grid-template-columns: 72px 1fr; }
      .bar-row strong { grid-column: 2; }
      th:nth-child(5), td:nth-child(5) { display: none; }
    }

    @media (max-width: 560px) {
      .filters, .metrics { grid-template-columns: 1fr; }
      table { font-size: 13px; }
      th:nth-child(4), td:nth-child(4) { display: none; }
      .metric-value { font-size: 20px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>懒人记账</h1>
    <div class="sub" id="ledgerMeta">本地账本</div>
  </header>
  <main>
    <div class="filters">
      <select id="monthFilter"></select>
      <select id="typeFilter">
        <option value="">全部类型</option>
        <option value="expense">支出</option>
        <option value="income">收入</option>
        <option value="refund">退款</option>
        <option value="transfer">转账</option>
      </select>
      <select id="categoryFilter"></select>
      <input id="searchInput" type="search" placeholder="搜索商户、备注、金额">
    </div>

    <div class="metrics">
      <div class="metric">
        <div class="metric-label">支出</div>
        <div class="metric-value expense" id="expenseTotal">¥0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">收入</div>
        <div class="metric-value income" id="incomeTotal">¥0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">退款</div>
        <div class="metric-value refund" id="refundTotal">¥0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">转账</div>
        <div class="metric-value transfer" id="transferTotal">¥0.00</div>
      </div>
      <div class="metric">
        <div class="metric-label">净额</div>
        <div class="metric-value" id="netTotal">¥0.00</div>
      </div>
    </div>

    <section>
      <div class="section-title">
        <span>分类支出</span>
        <span id="categoryCount">0 类</span>
      </div>
      <div class="bars" id="categoryBars"></div>
    </section>

    <section>
      <div class="section-title">
        <span>流水明细</span>
        <span id="rowCount">0 笔</span>
      </div>
      <div style="overflow:auto">
        <table>
          <thead>
            <tr>
              <th>日期</th>
              <th>类型</th>
              <th>分类</th>
              <th>商户</th>
              <th>备注</th>
              <th style="text-align:right">金额</th>
            </tr>
          </thead>
          <tbody id="transactionRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const LEDGER_DATA = __LEDGER_DATA__;

    const txs = Array.isArray(LEDGER_DATA.transactions) ? LEDGER_DATA.transactions : [];
    const formatMoney = (value) => new Intl.NumberFormat("zh-CN", {
      style: "currency",
      currency: LEDGER_DATA.currency || "CNY"
    }).format(Number(value || 0));
    const formatDate = (value) => (value || "").slice(0, 10);
    const monthOf = (tx) => (tx.occurred_at || "").slice(0, 7);
    const typeLabel = {
      expense: "支出",
      income: "收入",
      refund: "退款",
      transfer: "转账"
    };

    const monthFilter = document.getElementById("monthFilter");
    const typeFilter = document.getElementById("typeFilter");
    const categoryFilter = document.getElementById("categoryFilter");
    const searchInput = document.getElementById("searchInput");

    function unique(values) {
      return [...new Set(values.filter(Boolean))].sort().reverse();
    }

    function fillFilters() {
      const months = unique(txs.map(monthOf));
      const currentMonth = new Date().toISOString().slice(0, 7);
      const defaultMonth = months.includes(currentMonth) ? currentMonth : (months[0] || "");
      monthFilter.innerHTML = `<option value="">全部月份</option>` + months.map((m) => `<option value="${m}">${m}</option>`).join("");
      monthFilter.value = defaultMonth;

      const categories = unique(txs.map((tx) => tx.category || "其他")).sort();
      categoryFilter.innerHTML = `<option value="">全部分类</option>` + categories.map((c) => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join("");
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    function filteredRows() {
      const month = monthFilter.value;
      const type = typeFilter.value;
      const category = categoryFilter.value;
      const query = searchInput.value.trim().toLowerCase();
      return txs.filter((tx) => {
        if (month && monthOf(tx) !== month) return false;
        if (type && tx.type !== type) return false;
        if (category && (tx.category || "其他") !== category) return false;
        if (query) {
          const haystack = [tx.amount, tx.category, tx.merchant, tx.note, tx.type].join(" ").toLowerCase();
          if (!haystack.includes(query)) return false;
        }
        return true;
      }).sort((a, b) => String(b.occurred_at || "").localeCompare(String(a.occurred_at || "")));
    }

    function render() {
      const rows = filteredRows();
      const totals = { expense: 0, income: 0, refund: 0, transfer: 0 };
      const byCategory = {};

      for (const tx of rows) {
        const type = tx.type || "expense";
        const amount = Number(tx.amount || 0);
        if (Object.prototype.hasOwnProperty.call(totals, type)) totals[type] += amount;
        if (type === "expense") {
          const category = tx.category || "其他";
          byCategory[category] = (byCategory[category] || 0) + amount;
        }
      }

      document.getElementById("expenseTotal").textContent = formatMoney(totals.expense);
      document.getElementById("incomeTotal").textContent = formatMoney(totals.income);
      document.getElementById("refundTotal").textContent = formatMoney(totals.refund);
      document.getElementById("transferTotal").textContent = formatMoney(totals.transfer);
      document.getElementById("netTotal").textContent = formatMoney(totals.income + totals.refund - totals.expense);
      document.getElementById("rowCount").textContent = `${rows.length} 笔`;

      const categoryRows = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
      const maxCategory = Math.max(...categoryRows.map(([, amount]) => amount), 1);
      document.getElementById("categoryCount").textContent = `${categoryRows.length} 类`;
      document.getElementById("categoryBars").innerHTML = categoryRows.length ? categoryRows.map(([category, amount]) => {
        const width = Math.max(2, (amount / maxCategory) * 100);
        return `<div class="bar-row">
          <span>${escapeHtml(category)}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div>
          <strong>${formatMoney(amount)}</strong>
        </div>`;
      }).join("") : `<div class="empty">暂无分类支出</div>`;

      document.getElementById("transactionRows").innerHTML = rows.length ? rows.map((tx) => {
        const type = tx.type || "expense";
        return `<tr>
          <td>${escapeHtml(formatDate(tx.occurred_at))}</td>
          <td>${escapeHtml(typeLabel[type] || type)}</td>
          <td>${escapeHtml(tx.category || "其他")}</td>
          <td>${escapeHtml(tx.merchant || "")}</td>
          <td>${escapeHtml(tx.note || "")}</td>
          <td class="amount ${escapeHtml(type)}">${formatMoney(tx.amount)}</td>
        </tr>`;
      }).join("") : `<tr><td colspan="6"><div class="empty">暂无流水</div></td></tr>`;
    }

    document.getElementById("ledgerMeta").textContent = `交易 ${txs.length} 笔 · 更新 ${formatDate(LEDGER_DATA.updated_at) || "未知"}`;
    fillFilters();
    [monthFilter, typeFilter, categoryFilter, searchInput].forEach((el) => el.addEventListener("input", render));
    render();
  </script>
</body>
</html>
