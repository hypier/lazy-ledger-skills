<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>月度账单</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #efe8dc;
      --paper: #fbf7f0;
      --ink: #1f1a14;
      --muted: #6a5f54;
      --line: #d9cfc0;
      --pine: #2c5c4f;
      --expense: #9e3a32;
      --chip: #eadfcf;
      --focus: #2c5c4f;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", Georgia, serif;
      --sans: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #161310;
        --paper: #201c18;
        --ink: #f4ece3;
        --muted: #b6aa9c;
        --line: #3c342c;
        --pine: #86c4b0;
        --expense: #e08a82;
        --chip: #2b251f;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100vh;
      background:
        radial-gradient(900px 360px at 12% -8%, color-mix(in srgb, var(--pine) 12%, transparent), transparent 55%),
        var(--bg);
      color: var(--ink);
      font-family: var(--sans);
    }
    .bar {
      position: sticky; top: 0; z-index: 4;
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; flex-wrap: wrap;
      padding: 12px 18px;
      background: color-mix(in srgb, var(--paper) 92%, transparent);
      border-bottom: 1px solid var(--line);
    }
    .bar span { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; }
    button {
      height: 44px; padding: 0 16px; min-width: 44px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--chip); color: inherit; font: inherit; cursor: pointer;
    }
    button.primary { background: var(--pine); color: var(--paper); border-color: var(--pine); }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    .stage { padding: 28px 16px 72px; display: grid; justify-items: center; }
    canvas {
      width: min(840px, 100%);
      height: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: 0 18px 40px rgba(31, 26, 20, 0.08);
    }
    .sr {
      position: absolute; width: 1px; height: 1px;
      overflow: hidden; clip: rect(0, 0, 0, 0);
    }
    @media print {
      .bar { display: none; }
      body { background: white; }
      canvas { box-shadow: none; border: 0; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <span id="fileLabel">本机月度账单</span>
    <div class="actions">
      <button type="button" id="pngBtn">导出 PNG</button>
      <button class="primary" type="button" id="printBtn">打印</button>
    </div>
  </div>
  <main class="stage">
    <canvas id="bill" width="840" height="1200" aria-label="月度账单画布"></canvas>
    <div class="sr" id="fallback"></div>
  </main>
  <script>
    const DATA = __BILL_DATA__;
    const PAGE_W = 840;
    const MARGIN = 56;

    function theme() {
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      return dark ? {
        paper: "#201c18", ink: "#f4ece3", muted: "#b6aa9c", line: "#3c342c",
        pine: "#86c4b0", pineDeep: "#1a3d35", expense: "#e08a82", chip: "#2b251f",
        wash: "#2a241e", stamp: "#c45c54", gold: "#d4b07a",
        colors: ["#86c4b0", "#e08a82", "#8eb0d8", "#c4a35a", "#9bb59a", "#c2b0cc"]
      } : {
        paper: "#fbf7f0", ink: "#1f1a14", muted: "#6a5f54", line: "#d9cfc0",
        pine: "#2c5c4f", pineDeep: "#1e4037", expense: "#9e3a32", chip: "#eadfcf",
        wash: "#f3ece1", stamp: "#b23b32", gold: "#c4a35a",
        colors: ["#2c5c4f", "#9e3a32", "#3d5a80", "#c4a35a", "#6b8f71", "#6a5470"]
      };
    }

    function money(value) {
      return new Intl.NumberFormat("zh-CN", { style: "currency", currency: DATA.currency || "CNY" }).format(Number(value || 0));
    }

    function monthTitle(stamp) {
      const [year, month] = String(stamp || "").split("-");
      if (!year || !month) return stamp || "月度账单";
      return `${year}年${Number(month)}月`;
    }

    function topSlices(map, limit = 5) {
      const rows = Object.entries(map || {}).sort((a, b) => b[1] - a[1]);
      if (rows.length <= limit) return rows;
      const head = rows.slice(0, limit - 1);
      const rest = rows.slice(limit - 1).reduce((sum, item) => sum + item[1], 0);
      return head.concat([["其他", rest]]);
    }

    function wrap(ctx, text, maxWidth) {
      const lines = [];
      for (const para of String(text || "").replace(/\r/g, "").split("\n")) {
        if (!para) { lines.push(""); continue; }
        let line = "";
        for (const ch of para) {
          const trial = line + ch;
          if (line && ctx.measureText(trial).width > maxWidth) {
            lines.push(line);
            line = ch;
          } else {
            line = trial;
          }
        }
        if (line) lines.push(line);
      }
      return lines;
    }

    function plainLetter(body) {
      return String(body || "")
        .replace(/^#{1,3}\s+/gm, "")
        .replace(/\*\*(.+?)\*\*/g, "$1")
        .replace(/^[-*]\s+/gm, "• ")
        .trim();
    }

    function letterBlocks(body) {
      return plainLetter(body).split(/\n{2,}/).filter(Boolean);
    }

    function drawRoundRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawDonut(ctx, cx, cy, r, slices, colors) {
      const total = slices.reduce((sum, item) => sum + item[1], 0) || 1;
      let start = -Math.PI / 2;
      slices.forEach((item, index) => {
        const angle = (item[1] / total) * Math.PI * 2;
        ctx.beginPath();
        ctx.arc(cx, cy, r, start, start + angle);
        ctx.arc(cx, cy, r * 0.62, start + angle, start, true);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
        start += angle;
      });
    }

    function drawLine(ctx, x, y, w, h, points, color) {
      if (!points.length) return;
      const max = Math.max(...points.map((item) => item[1]), 1);
      const coords = points.map((item, index) => {
        const px = x + (points.length === 1 ? w / 2 : index / (points.length - 1) * w);
        const py = y + h - (item[1] / max) * h;
        return [px, py];
      });
      ctx.beginPath();
      ctx.moveTo(coords[0][0], y + h);
      coords.forEach((point) => ctx.lineTo(point[0], point[1]));
      ctx.lineTo(coords[coords.length - 1][0], y + h);
      ctx.closePath();
      const grad = ctx.createLinearGradient(0, y, 0, y + h);
      grad.addColorStop(0, color);
      grad.addColorStop(1, "transparent");
      ctx.fillStyle = grad;
      ctx.globalAlpha = 0.18;
      ctx.fill();
      ctx.globalAlpha = 1;
      ctx.beginPath();
      coords.forEach((point, index) => index ? ctx.lineTo(point[0], point[1]) : ctx.moveTo(point[0], point[1]));
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.lineJoin = "round";
      ctx.stroke();
      coords.forEach((point) => {
        ctx.beginPath();
        ctx.arc(point[0], point[1], 3.2, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
      });
    }

    function drawCornerFlourish(ctx, x, y, T, flipX, flipY) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(flipX ? -1 : 1, flipY ? -1 : 1);
      ctx.strokeStyle = T.gold;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, 28);
      ctx.quadraticCurveTo(0, 0, 28, 0);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(8, 28);
      ctx.quadraticCurveTo(8, 8, 28, 8);
      ctx.stroke();
      ctx.restore();
    }

    function drawPineSprig(ctx, x, y, T) {
      ctx.save();
      ctx.translate(x, y);
      ctx.strokeStyle = T.pine;
      ctx.fillStyle = T.pine;
      ctx.lineWidth = 1.6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(0, 36);
      ctx.quadraticCurveTo(6, 18, 4, 0);
      ctx.stroke();
      [[-10, 8], [12, 10], [-8, 18], [14, 20], [-6, 26], [10, 28]].forEach((pair, index) => {
        ctx.beginPath();
        ctx.moveTo(3, 6 + index * 4);
        ctx.quadraticCurveTo(pair[0] * 0.4, pair[1] - 4, pair[0], pair[1]);
        ctx.stroke();
      });
      ctx.restore();
    }

    function drawStamp(ctx, cx, cy, T, month) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-0.12);
      ctx.strokeStyle = T.stamp;
      ctx.fillStyle = T.stamp;
      ctx.globalAlpha = 0.88;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(0, 0, 34, 0, Math.PI * 2);
      ctx.stroke();
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.arc(0, 0, 28, 0, Math.PI * 2);
      ctx.stroke();
      ctx.font = "600 20px Songti SC, STSong, serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("记", 0, -7);
      ctx.font = "12px Songti SC, STSong, serif";
      ctx.fillText(month.replace("-", "."), 0, 12);
      ctx.restore();
      ctx.textAlign = "start";
      ctx.textBaseline = "alphabetic";
    }

    function drawBookMark(ctx, x, y, T) {
      ctx.fillStyle = T.stamp;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + 18, y);
      ctx.lineTo(x + 18, y + 36);
      ctx.lineTo(x + 9, y + 28);
      ctx.lineTo(x, y + 36);
      ctx.closePath();
      ctx.fill();
    }

    function drawSectionMark(ctx, x, y, T) {
      ctx.fillStyle = T.pine;
      drawRoundRect(ctx, x, y - 14, 6, 18, 2);
      ctx.fill();
      ctx.fillStyle = T.gold;
      ctx.fillRect(x + 1, y - 12, 4, 4);
    }

    function paint() {
      const T = theme();
      const facts = DATA.facts || {};
      const totals = facts.totals || {};
      const saved = DATA.bill || {};
      const slices = topSlices(facts.by_category);
      const merchants = (facts.top_merchants || []).slice(0, 5);
      const trend = Object.entries(facts.by_day || {}).slice(-12);
      const letter = saved.body || (facts.insights || []).map((item) => "• " + item).join("\n");
      const title = saved.title || `${monthTitle(DATA.month)}账单`;

      const canvas = document.getElementById("bill");
      const probe = canvas.getContext("2d");
      const contentW = PAGE_W - MARGIN * 2;
      const letterWidth = contentW - 28;
      probe.font = "16px PingFang SC, sans-serif";
      let letterH = 0;
      for (const block of letterBlocks(letter || " ")) {
        letterH += wrap(probe, block, letterWidth).length * 26 + 12;
      }
      const pageH = Math.max(1240, 760 + merchants.length * 52 + letterH);

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = PAGE_W * dpr;
      canvas.height = pageH * dpr;
      canvas.style.width = PAGE_W + "px";
      canvas.style.height = pageH + "px";
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const paper = ctx.createLinearGradient(0, 0, PAGE_W, pageH);
      paper.addColorStop(0, T.paper);
      paper.addColorStop(1, T.wash);
      ctx.fillStyle = paper;
      ctx.fillRect(0, 0, PAGE_W, pageH);
      ctx.strokeStyle = T.line;
      ctx.globalAlpha = 0.38;
      for (let lineY = 40; lineY < pageH; lineY += 28) {
        ctx.beginPath();
        ctx.moveTo(MARGIN - 8, lineY);
        ctx.lineTo(PAGE_W - 36, lineY);
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = T.pineDeep;
      ctx.fillRect(0, 0, 10, pageH);
      ctx.fillStyle = T.gold;
      ctx.fillRect(10, 0, 3, pageH);
      for (let holeY = 64; holeY < pageH - 40; holeY += 92) {
        ctx.beginPath();
        ctx.arc(28, holeY, 5, 0, Math.PI * 2);
        ctx.fillStyle = T.chip;
        ctx.fill();
        ctx.strokeStyle = T.line;
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      drawCornerFlourish(ctx, 42, 22, T, false, false);
      drawCornerFlourish(ctx, PAGE_W - 28, 22, T, true, false);
      drawCornerFlourish(ctx, 42, pageH - 22, T, false, true);
      drawCornerFlourish(ctx, PAGE_W - 28, pageH - 22, T, true, true);
      drawPineSprig(ctx, PAGE_W - 92, 36, T);
      drawBookMark(ctx, PAGE_W - 48, 0, T);
      drawStamp(ctx, PAGE_W - 118, 118, T, String(DATA.month || ""));

      let y = 52;
      ctx.fillStyle = T.muted;
      ctx.font = "12px PingFang SC, sans-serif";
      ctx.fillText("本机账本 · 月度账单", MARGIN + 8, y);
      y += 40;
      ctx.fillStyle = T.ink;
      ctx.font = "600 40px Songti SC, STSong, serif";
      ctx.fillText(title, MARGIN + 8, y);
      y += 28;
      ctx.fillStyle = T.muted;
      ctx.font = "14px PingFang SC, sans-serif";
      ctx.fillText(`${monthTitle(DATA.month)}  ·  ${facts.count || 0} 笔  ·  日均 ${money(facts.daily_average)}`, MARGIN + 8, y);
      y += 32;

      const cards = [
        ["支出", money(totals.expense), T.expense],
        ["收入", money(totals.income), T.pine],
        ["净额", money(totals.net), T.ink]
      ];
      const gap = 12;
      const cardW = (contentW - gap * 2) / 3;
      cards.forEach((card, index) => {
        const x = MARGIN + index * (cardW + gap);
        ctx.fillStyle = T.chip;
        drawRoundRect(ctx, x, y, cardW, 84, 16);
        ctx.fill();
        ctx.fillStyle = card[2];
        drawRoundRect(ctx, x, y, 5, 84, 2);
        ctx.fill();
        ctx.fillStyle = T.muted;
        ctx.font = "13px PingFang SC, sans-serif";
        ctx.fillText(card[0], x + 18, y + 30);
        ctx.fillStyle = card[2];
        ctx.font = "600 22px Songti SC, STSong, serif";
        ctx.fillText(card[1], x + 18, y + 60);
      });
      const change = facts.comparison && facts.comparison.expense_change_pct;
      if (change != null) {
        ctx.fillStyle = Number(change) > 0 ? T.expense : T.pine;
        ctx.font = "12px PingFang SC, sans-serif";
        const sign = change > 0 ? "+" : "";
        ctx.fillText(`较上月支出 ${sign}${Number(change).toFixed(1)}%`, MARGIN, y + 108);
      }
      y += 132;

      drawSectionMark(ctx, MARGIN, y, T);
      ctx.fillStyle = T.ink;
      ctx.font = "600 18px Songti SC, STSong, serif";
      ctx.fillText("分类与走势", MARGIN + 14, y);
      y += 22;
      ctx.fillStyle = T.chip;
      drawRoundRect(ctx, MARGIN, y, contentW, 188, 18);
      ctx.fill();
      const donutX = MARGIN + 78;
      const donutY = y + 92;
      if (slices.length) drawDonut(ctx, donutX, donutY, 62, slices, T.colors);
      ctx.fillStyle = T.paper;
      ctx.beginPath();
      ctx.arc(donutX, donutY, 34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = T.muted;
      ctx.font = "11px PingFang SC, sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("支出", donutX, donutY - 2);
      ctx.fillStyle = T.ink;
      ctx.font = "600 13px Songti SC, STSong, serif";
      ctx.fillText(money(totals.expense), donutX, donutY + 16);
      ctx.textAlign = "start";
      const pieTotal = slices.reduce((sum, item) => sum + item[1], 0) || 1;
      slices.forEach((item, index) => {
        const ly = y + 28 + index * 26;
        ctx.fillStyle = T.colors[index % T.colors.length];
        ctx.beginPath();
        ctx.arc(MARGIN + 168, ly - 4, 5, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = T.ink;
        ctx.font = "13px PingFang SC, sans-serif";
        ctx.fillText(item[0], MARGIN + 180, ly);
        ctx.fillStyle = T.muted;
        ctx.font = "12px ui-monospace, SF Mono, monospace";
        ctx.fillText(`${Math.round(item[1] / pieTotal * 100)}%  ${money(item[1])}`, MARGIN + 232, ly);
      });
      drawLine(ctx, MARGIN + 430, y + 24, contentW - 454, 128, trend, T.pine);
      ctx.fillStyle = T.muted;
      ctx.font = "12px PingFang SC, sans-serif";
      ctx.fillText(trend.length ? "每日支出" : "暂无每日走势", MARGIN + 430, y + 168);
      y += 212;

      drawSectionMark(ctx, MARGIN, y, T);
      ctx.fillStyle = T.ink;
      ctx.font = "600 18px Songti SC, STSong, serif";
      ctx.fillText("商户", MARGIN + 14, y);
      y += 18;
      const maxMerchant = Math.max(...merchants.map((item) => Number(item.amount || 0)), 1);
      if (!merchants.length) {
        ctx.fillStyle = T.muted;
        ctx.font = "14px PingFang SC, sans-serif";
        ctx.fillText("这个月还没有商户统计。", MARGIN, y + 12);
        y += 36;
      }
      merchants.forEach((item, index) => {
        const amount = Number(item.amount || 0);
        const name = String(item.merchant || "");
        const color = T.colors[index % T.colors.length];
        ctx.fillStyle = T.chip;
        drawRoundRect(ctx, MARGIN, y, contentW, 46, 12);
        ctx.fill();
        ctx.fillStyle = T.ink;
        ctx.font = "13px PingFang SC, sans-serif";
        const label = name.length > 16 ? name.slice(0, 16) + "…" : name;
        ctx.fillText(label, MARGIN + 14, y + 18);
        ctx.fillStyle = T.muted;
        ctx.font = "12px ui-monospace, SF Mono, monospace";
        const amountText = money(amount);
        ctx.fillText(amountText, PAGE_W - MARGIN - 14 - ctx.measureText(amountText).width, y + 18);
        const trackX = MARGIN + 14;
        const trackW = contentW - 28;
        const trackY = y + 28;
        ctx.fillStyle = T.paper;
        drawRoundRect(ctx, trackX, trackY, trackW, 8, 4);
        ctx.fill();
        const barW = Math.max(10, amount / maxMerchant * trackW);
        ctx.fillStyle = color;
        drawRoundRect(ctx, trackX, trackY, barW, 8, 4);
        ctx.fill();
        y += 54;
      });
      y += 10;

      drawSectionMark(ctx, MARGIN, y, T);
      ctx.fillStyle = T.ink;
      ctx.font = "600 18px Songti SC, STSong, serif";
      ctx.fillText("这月怎么过的", MARGIN + 14, y);
      y += 18;
      const letterTop = y;
      const source = letter || "数字已经齐了，文字结论还没有。";
      ctx.font = "16px PingFang SC, sans-serif";
      let blockH = 24;
      for (const block of letterBlocks(source)) {
        blockH += wrap(ctx, block, letterWidth).length * 26 + 10;
      }
      ctx.fillStyle = T.chip;
      drawRoundRect(ctx, MARGIN, letterTop, contentW, blockH, 16);
      ctx.fill();
      ctx.fillStyle = T.pine;
      ctx.fillRect(MARGIN, letterTop + 14, 4, blockH - 28);
      y = letterTop + 28;
      ctx.fillStyle = T.ink;
      ctx.font = "16px PingFang SC, sans-serif";
      for (const block of letterBlocks(source)) {
        for (const line of wrap(ctx, block, letterWidth)) {
          ctx.fillText(line || " ", MARGIN + 20, y);
          y += 26;
        }
        y += 10;
      }

      ctx.fillStyle = T.muted;
      ctx.font = "12px PingFang SC, sans-serif";
      ctx.fillText("仅保存在本机 · 可导出 PNG 或打印", MARGIN, pageH - 28);

      document.title = title;
      document.getElementById("fileLabel").textContent = `${monthTitle(DATA.month)} · 画布账单`;
      document.getElementById("fallback").textContent = `${title}。支出 ${money(totals.expense)}，收入 ${money(totals.income)}。${plainLetter(letter)}`;
    }

    paint();
    matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
    document.getElementById("printBtn").addEventListener("click", () => window.print());
    document.getElementById("pngBtn").addEventListener("click", () => {
      const canvas = document.getElementById("bill");
      const link = document.createElement("a");
      link.download = `lazy-ledger-bill-${DATA.month || "month"}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  </script>
</body>
</html>
